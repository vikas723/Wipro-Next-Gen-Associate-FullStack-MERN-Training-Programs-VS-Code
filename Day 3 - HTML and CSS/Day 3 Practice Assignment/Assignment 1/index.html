<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management | Spring High School</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app-wrapper">

    <!-- HEADER -->
    <header class="top-bar">
        <img src="images/logo.png" alt="Spring High School Logo" class="school-logo">

        <nav class="menu">
            <a href="#welcome">Home</a>
            <a href="#profile">Student Profile</a>
        </nav>
    </header>

    <!-- WELCOME -->
    <section class="welcome" id="welcome">
        <div class="welcome-card">
        <h1>Welcome to Spring High School</h1>
        <p>Student’s Choice, Student’s Voice</p>
    </section>

    <!-- STUDENT CARD -->
    <section class="content-card" id="profile">

        <div class="student-image-wrapper">
            <img src="images/student.jpg" alt="Student Image">
        </div>

        <div class="student-details">
            <h2>Student Information</h2>
            <p><strong>Name:</strong> Rahul Sharma</p>
            <p><strong>Class:</strong> 10th Standard</p>
            <p><strong>Roll No:</strong> 25</p>
            <p><strong>School:</strong> Spring High School</p>
        </div>

    </section>

</main>

</body>
</html>
