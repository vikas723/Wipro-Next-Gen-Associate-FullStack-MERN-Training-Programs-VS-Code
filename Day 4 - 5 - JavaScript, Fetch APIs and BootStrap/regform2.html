<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .form-container {
            max-width: 400px;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .output {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>User Registration</h2>

    <form id="registrationForm">
       
        <label for="username">Username</label>
        <input type="text" id="username" required>

       
        <label for="age">Age</label>
        <input type="number" id="age" required>

        
        <label>
            <input type="checkbox" id="isSubscribed">
            Subscribe to newsletter
        </label>

        <button type="submit">Register</button>
    </form>

    <div class="output" id="result"></div>
</div>

<script>
    document.getElementById("registrationForm").addEventListener("submit", function (event) {
        event.preventDefault(); 
        const username = document.getElementById("username").value;
        const age = Number(document.getElementById("age").value);
        const isSubscribed = document.getElementById("isSubscribed").checked;

        let resultMessage = "";

        if (typeof username !== "string" || username.trim() === "") {
            resultMessage = "❌ Username must be a valid string.";
        } 
        else if (typeof age !== "number" || isNaN(age) || age <= 0) {
            resultMessage = "❌ Age must be a valid number greater than 0.";
        } 
        else if (typeof isSubscribed !== "boolean") {
            resultMessage = "❌ Subscription value must be boolean.";
        } 
        else {
            resultMessage = `
                ✅ Registration Successful! <br><br>
                Username: ${username} <br>
                Age: ${age} <br>
                Subscribed: ${isSubscribed}
            `;
        }

        document.getElementById("result").innerHTML = resultMessage;
    });
</script>

</body>
</html>
