<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<h3>Todo Task Directory</h3>
<ul id="users"></ul>

<script>
  // fetch based implementation
  function fetchingTodos() {
    return new Promise((resolve, reject) => {   
      fetch('https://jsonplaceholder.typicode.com/todos') 
        .then(response => {
          if (!response.ok) {
            reject("Failed to fetch todo tasks"); 
          }
          return response.json(); 
        })
        .then(data => resolve(data)) 
        .catch(err => reject(err));  
    });
  }

  // Promise-based implementation
  fetchingTodos()
    .then(todos => {
      const ul = document.getElementById("users");

      
      const firstFiveTodos = todos.slice(0, 5); // Retrieving the first 5 users data

      firstFiveTodos.forEach(todo => {
        const li = document.createElement("li");

      
        li.textContent = 
          `User ID: ${todo.userId} | Email: user${todo.userId}@company.com | Completed: ${todo.completed}`; //Email is simulated

        ul.append(li);
      });
    })
    .catch(err => console.error("Error:", err));
</script>
