<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Salary Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            background: #f1f1f1;
            padding: 15px;
            border-radius: 6px;
        }

        .result p {
            margin: 6px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Employee Salary Calculator</h2>

    <form id="salaryForm">
        <label>Employee Name</label>
        <input type="text" id="name" required>

        <label>Working Days</label>
        <input type="number" id="days" required>

        <label>Basic Pay</label>
        <input type="number" id="basicPay" required>

        <label>Bonus</label>
        <input type="number" id="bonus" value="0">

        <button type="submit">Calculate Salary</button>
    </form>

    <div class="result" id="output" style="display:none;"></div>
</div>

<script>
    document.getElementById("salaryForm").addEventListener("submit", function (event) {
        event.preventDefault();

        // Employee object
        const employee = {
            name: document.getElementById("name").value,
            workingDays: Number(document.getElementById("days").value),
            basicPay: Number(document.getElementById("basicPay").value),
            bonus: Number(document.getElementById("bonus").value)
        };

        const TOTAL_WORKING_DAYS = 30;

        // Salary calculations
        const perDaySalary = employee.basicPay / TOTAL_WORKING_DAYS;
        const earnedSalary = perDaySalary * employee.workingDays;
        const grossSalary = earnedSalary + employee.bonus;

        let taxRate = 0;
        if (grossSalary <= 25000) {
            taxRate = 0.05;
        } else if (grossSalary <= 50000) {
            taxRate = 0.10;
        } else {
            taxRate = 0.20;
        }

        const taxAmount = grossSalary * taxRate;
        const netSalary = grossSalary - taxAmount;

        // Display result
        document.getElementById("output").style.display = "block";
        document.getElementById("output").innerHTML = `
            <p><strong>Employee Name:</strong> ${employee.name}</p>
            <p><strong>Gross Salary:</strong> ₹${grossSalary.toFixed(2)}</p>
            <p><strong>Tax Deduction:</strong> ₹${taxAmount.toFixed(2)}</p>
            <p><strong>Net Salary:</strong> ₹${netSalary.toFixed(2)}</p>
        `;
    });
</script>

</body>
</html>
