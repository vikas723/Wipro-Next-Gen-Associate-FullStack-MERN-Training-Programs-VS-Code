<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand">Infinity Event Management</a>
        </div>
    </nav>
</header>

<main class="container my-5">

    <!-- Dashboard Filters  -->
    <section class="mb-4">
        <h2 class="text-center mb-3">Event Dashboard</h2>

        <div class="row g-3">
            <div class="col-md-4">
                <select id="categoryFilter" class="form-select">
                    <option value="all">All Categories</option>
                    <option value="Conference">Conference</option>
                    <option value="Wedding">Wedding</option>
                    <option value="Music">Music</option>
                </select>
            </div>

            <div class="col-md-4">
                <input type="date" id="dateFilter" class="form-control">
            </div>

            <div class="col-md-4 text-center">
                <button id="resetBtn" class="btn btn-secondary w-100">Reset Filters</button>
            </div>
        </div>
    </section>

    <!--  Events Container  -->
    <section>
        <div id="eventContainer" class="row g-4"></div>
    </section>

</main>

<footer class="bg-dark text-white text-center p-3">
    &copy; 2026 EventPro
</footer>

<script src="script.js"></script>
</body>
</html>
