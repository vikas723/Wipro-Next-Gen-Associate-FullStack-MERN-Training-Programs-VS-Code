<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <Script>
        async function fetchUserAsync()
        {
            console.log("Fetching all users data");
            const response = await fetch(" https://jsonplaceholder.typicode.com/users") //request will come back 
            
            const data = await response.json()
            console.log("users data", data);
        }

        fetchUserAsync()
        console.log("Meanwhile the rest of app execution will be running"); // process runs asynchronously and it is a non-blocker



    </Script>
    
</body>
</html>
