<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       // The spread operator (...) is used to expand values of an array or object into individual elements.
       // //Think of it as opening a bag and taking everything out.

       const num = [1, 2, 3];
       const newarr = [...num]; //copy an array
       console.log(newarr);

       const a1 = [10, 20];  //Merging array
       const a2 = [30,40];
       const merge = [...a1, ...a2];
       console.log(merge);

       const fruits = ["Apple", "Banana"];
       const newFruits = [...fruits, "Mango"]; //adding a new array
       console.log(newFruits);

       const user = { name: "Vikas", age: 22 }; //copying an object
       const copyUser = { ...user };

       console.log(copyUser);

       const user1 = { name: "Vikas", age: 22 }; //override values
       const updatedUser = { ...user1, age: 23 };
       console.log(updatedUser);



    </script>
</body>
</html>
