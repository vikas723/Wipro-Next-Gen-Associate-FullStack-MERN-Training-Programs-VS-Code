<!DOCTYPE html>
<html>
<head>
    <title>Div Example and SPAN Example</title>
    <style>
        .box {
            background-color: lightblue;
            padding: 10px;
            margin: 10px 0;
        }
        .highlight
        {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        This is a DIV element
    </div>

    <div class="box">
        This is another DIV element
    </div>
    
    <p>
        This is a <span class="highlight">SPAN</span> element inside a paragraph.
    </p>
</body>
</html>
