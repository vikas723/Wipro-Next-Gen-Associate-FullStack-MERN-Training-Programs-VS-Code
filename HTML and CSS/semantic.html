<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML5 Semantic Elements Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        header, nav, section, article, aside, footer {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 8px;
        }
        nav a {
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <!-- Header: Contains website title or logo -->
    <header>
        <h1>My Website</h1>
        <p>Learning HTML5 Semantic Elements</p>
    </header>

    <!-- Navigation: Menu links -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main content area -->
    <main>

        <!-- Section: Group of related content -->
        <section>
            <h2>About Us</h2>
            <p>This section contains information about the website.</p>
        </section>

        <!-- Article: Independent, reusable content -->
        <article>
            <h2>Latest Article</h2>
            <p>This article can be shared or reused independently.</p>
        </article>

        <!-- Aside: Side content like ads or tips -->
        <aside>
            <h3>Related Links</h3>
            <ul>
                <li>HTML Basics</li>
                <li>CSS Basics</li>
            </ul>
        </aside>

    </main>

    <!-- Footer: Copyright and extra info -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
