<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fetch API Assignment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📘 Fetch API Blogging Platform</h1>
    <p>Posts & Todos powered by JSONPlaceholder API</p>
</header>

<main>

    <section class="card">
        <h2> Blog Posts</h2>
        <div id="posts" class="grid"></div>
        <p id="postsError" class="error"></p>

    <!-- TODOS SECTION -->
    <section class="card">
        <h2> Todo List</h2>
        <div id="todos" class="list"></div>
        <p id="todosError" class="error"></p>
    </section>
</main>

<footer>
    <p>Fetch API Daily Coding Activity | Week 1</p>
</footer>

<script src="app.js"></script>
</body>
</html>
